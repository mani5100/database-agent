[project]
name = "database-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdul Rehman", email = "m.abdulrehman.shoukat@gmial.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "sqlglot>=30.18.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
database-agent = "database_agent:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
