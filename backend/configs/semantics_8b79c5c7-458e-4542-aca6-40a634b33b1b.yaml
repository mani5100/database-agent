version: 1
models:
- name: order_line_items
  source: csv
  physical_name: data
  description: This table captures every individual line item that appears on a customer
    order, recording product details, sales figures, shipping dates, and profitability
    for each SKU sold.
  synonyms:
  - order detail
  - sales item
  - line‑item record
  columns:
  - name: row_identifier
    physical_name: Row ID
    physical_type: integer
    is_primary_key: false
    description: A unique numeric key that identifies the row within the table.
    synonyms:
    - row number
    - record id
  - name: order_identifier
    physical_name: Order ID
    physical_type: text
    is_primary_key: false
    description: The identifier of the parent order to which this line item belongs.
    synonyms:
    - order number
    - transaction id
  - name: order_date
    physical_name: Order Date
    physical_type: date
    is_primary_key: false
    description: The calendar date on which the customer placed the order.
    synonyms:
    - purchase date
    - order placement date
  - name: ship_date
    physical_name: Ship Date
    physical_type: date
    is_primary_key: false
    description: The calendar date when this item was shipped to the customer.
    synonyms:
    - delivery date
    - dispatch date
  - name: shipping_method
    physical_name: Ship Mode
    physical_type: text
    is_primary_key: false
    description: The chosen shipping service or speed for delivering the order.
    synonyms:
    - shipping type
    - delivery method
  - name: customer_identifier
    physical_name: Customer ID
    physical_type: text
    is_primary_key: false
    description: A unique code that identifies the customer who placed the order.
    synonyms:
    - customer number
    - client id
  - name: customer_name
    physical_name: Customer Name
    physical_type: text
    is_primary_key: false
    description: The full name of the buyer associated with this order line.
    synonyms:
    - buyer name
    - client name
  - name: market_segment
    physical_name: Segment
    physical_type: text
    is_primary_key: false
    description: The business segment classification (e.g., Consumer, Corporate) for
      the customer.
    synonyms:
    - segment type
    - market category
  - name: country
    physical_name: Country
    physical_type: text
    is_primary_key: false
    description: The nation where the order was placed or shipped to.
    synonyms:
    - nation
    - country of purchase
  - name: city
    physical_name: City
    physical_type: text
    is_primary_key: false
    description: The city component of the shipping address for this line item.
    synonyms:
    - town
    - city name
  - name: state_province
    physical_name: State
    physical_type: text
    is_primary_key: false
    description: The sub‑national region (state or province) of the shipping address.
    synonyms:
    - state
    - province
  - name: postal_code
    physical_name: Postal Code
    physical_type: text
    is_primary_key: false
    description: The ZIP or postal code used for delivery of this item.
    synonyms:
    - zip code
    - postal zip
  - name: sales_region
    physical_name: Region
    physical_type: text
    is_primary_key: false
    description: The broader geographic region (e.g., East, West) where the customer
      resides.
    synonyms:
    - region type
    - area
  - name: product_identifier
    physical_name: Product ID
    physical_type: text
    is_primary_key: false
    description: A unique SKU that identifies the product sold on this line item.
    synonyms:
    - product number
    - item id
  - name: product_category
    physical_name: Category
    physical_type: text
    is_primary_key: false
    description: The high‑level classification of the product (e.g., Furniture, Office
      Supplies).
    synonyms:
    - category type
    - product group
  - name: sub_category
    physical_name: Sub-Category
    physical_type: text
    is_primary_key: false
    description: A more specific classification within the main category for this
      product.
    synonyms:
    - subcategory type
    - product sub-group
  - name: product_description
    physical_name: Product Name
    physical_type: text
    is_primary_key: false
    description: The full name or title of the product sold on this line item.
    synonyms:
    - item name
    - product title
  - name: sales_amount
    physical_name: Sales
    physical_type: float
    is_primary_key: false
    description: Total revenue generated by this line item before any discounts are
      applied.
    synonyms:
    - revenue
    - sales value
  - name: quantity_sold
    physical_name: Quantity
    physical_type: integer
    is_primary_key: false
    description: Number of units of the product ordered in this line item.
    synonyms:
    - units
    - qty
  - name: discount_applied
    physical_name: Discount
    physical_type: float
    is_primary_key: false
    description: The discount rate or amount applied to this line item, expressed
      as a decimal fraction.
    synonyms:
    - discount rate
    - price reduction
  - name: profit_amount
    physical_name: Profit
    physical_type: float
    is_primary_key: false
    description: Net profit earned from this line item after accounting for costs
      and discounts.
    synonyms:
    - net profit
    - profit value
relationships: []
