version: 1
models:
- name: customers
  source: postgres
  physical_name: customers
  description: The **customers** table stores a unique identifier for each customer
    and the human‑readable name that is shown in user interfaces.
  synonyms:
  - clients
  - patrons
  - buyers
  - account holders
  columns:
  - name: id
    physical_name: id
    description: A system‑generated, unique integer that serves as the primary key
      for the customer record.
    synonyms:
    - customer_id
    - primary_key
    - unique_id
  - name: display_name
    physical_name: display_name
    description: The name displayed to users and in reports that represents the customer
      (e.g., company or individual name).
    synonyms:
    - customer_name
    - company_name
    - business_name
    - label
- name: orders
  source: postgres
  physical_name: orders
  description: The **orders** table records individual purchase transactions made
    by customers. Each row represents a single order with its unique identifier, the
    customer who placed it, the total amount paid, and the timestamp of when the order
    was created.
  synonyms:
  - Order Records
  - Purchase Orders
  - Transaction Log
  columns:
  - name: order_id
    physical_name: id
    description: A unique identifier assigned to each order.
    synonyms:
    - Order Number
    - Order Key
  - name: customer_id
    physical_name: customer_id
    description: The identifier of the customer who placed the order.
    synonyms:
    - Customer Reference
    - Client ID
  - name: amount
    physical_name: amt
    description: The total monetary value of the order in the store's currency.
    synonyms:
    - Total Price
    - Order Value
    - Purchase Amount
  - name: timestamp
    physical_name: ts
    description: The date and time when the order was created or recorded.
    synonyms:
    - Order Time
    - Transaction Date/Time
    - Created At
relationships:
- name: orders_to_customers
  from_model: orders
  from_column: customer_id
  to_model: customers
  to_column: id
  type: many_to_one
  description: Each orders belongs to one customers
