version: 1
models:
- name: order_line_items
  source: csv
  physical_name: data
  description: 'This table records each individual line item within customer orders,
    capturing product details, sales figures, and shipping information for every transaction.


    Synonyms: order line item, sales detail, transaction line'
  synonyms:
  - order line item
  - sales detail
  - transaction line
  columns:
  - name: row_id
    physical_name: Row ID
    physical_type: integer
    is_primary_key: false
    description: A unique integer that identifies the row within the table.
    synonyms:
    - Record ID
    - Line Number
  - name: order_id
    physical_name: Order ID
    physical_type: text
    is_primary_key: false
    description: The identifier for the customer order to which this line item belongs.
    synonyms:
    - Purchase Order ID
    - Transaction ID
  - name: order_date
    physical_name: Order Date
    physical_type: date
    is_primary_key: false
    description: The date on which the order was placed by the customer.
    synonyms:
    - Purchase Date
    - Order Placement Date
  - name: ship_date
    physical_name: Ship Date
    physical_type: date
    is_primary_key: false
    description: The date on which the order line item was shipped to the customer.
    synonyms:
    - Delivery Date
    - Dispatch Date
  - name: ship_mode
    physical_name: Ship Mode
    physical_type: text
    is_primary_key: false
    description: The shipping method used for delivering the product (e.g., Second
      Class, First Class).
    synonyms:
    - Shipping Method
    - Delivery Type
  - name: customer_id
    physical_name: Customer ID
    physical_type: text
    is_primary_key: false
    description: A unique identifier for the customer who placed the order.
    synonyms:
    - Client ID
    - Buyer ID
  - name: customer_name
    physical_name: Customer Name
    physical_type: text
    is_primary_key: false
    description: The full name of the customer who placed the order.
    synonyms:
    - Client Name
    - Buyer Name
  - name: segment
    physical_name: Segment
    physical_type: text
    is_primary_key: false
    description: The market segment classification for the customer (e.g., Consumer,
      Corporate).
    synonyms:
    - Market Segment
    - Customer Category
  - name: country
    physical_name: Country
    physical_type: text
    is_primary_key: false
    description: The country where the order was placed.
    synonyms:
    - Nation
    - Locale Country
  - name: city
    physical_name: City
    physical_type: text
    is_primary_key: false
    description: The city of the customer's shipping address.
    synonyms:
    - Municipality
    - Urban Area
  - name: state
    physical_name: State
    physical_type: text
    is_primary_key: false
    description: The state or province of the customer's shipping address.
    synonyms:
    - Region State
    - Province
  - name: postal_code
    physical_name: Postal Code
    physical_type: text
    is_primary_key: false
    description: The postal (ZIP) code for the customer's shipping address.
    synonyms:
    - Zip Code
    - Postcode
  - name: region
    physical_name: Region
    physical_type: text
    is_primary_key: false
    description: The broader geographic region of the customer (e.g., South, West).
    synonyms:
    - Geographic Region
    - Area
  - name: product_id
    physical_name: Product ID
    physical_type: text
    is_primary_key: false
    description: A unique identifier for the product sold.
    synonyms:
    - Item ID
    - SKU
  - name: category
    physical_name: Category
    physical_type: text
    is_primary_key: false
    description: The high‑level category of the product (e.g., Furniture, Office Supplies).
    synonyms:
    - Product Category
    - Main Category
  - name: sub_category
    physical_name: Sub-Category
    physical_type: text
    is_primary_key: false
    description: A more specific classification within the main category (e.g., Bookcases,
      Chairs).
    synonyms:
    - Item Subcategory
    - Detailed Category
  - name: product_name
    physical_name: Product Name
    physical_type: text
    is_primary_key: false
    description: The descriptive name of the product sold.
    synonyms:
    - Item Name
    - Product Description
  - name: sales
    physical_name: Sales
    physical_type: float
    is_primary_key: false
    description: The total revenue generated by this line item before discounts and
      taxes.
    synonyms:
    - Revenue
    - Gross Sales
  - name: quantity
    physical_name: Quantity
    physical_type: integer
    is_primary_key: false
    description: The number of units of the product sold in this line item.
    synonyms:
    - Units Sold
    - Qty
  - name: discount
    physical_name: Discount
    physical_type: float
    is_primary_key: false
    description: The discount rate applied to this line item (as a decimal).
    synonyms:
    - Discount Rate
    - Price Reduction
  - name: profit
    physical_name: Profit
    physical_type: float
    is_primary_key: false
    description: The net profit earned from this line item after all costs and discounts.
    synonyms:
    - Net Profit
    - Margin
relationships: []
