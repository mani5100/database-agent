version: 1
models:
- name: order_details
  source: csv
  physical_name: data
  description: The **order_details** table captures every line item in customer orders,
    linking product information, sales performance, shipping logistics, and customer
    demographics for each transaction.
  synonyms:
  - Order Lines
  - Sales Detail
  - Transaction Detail
  columns:
  - name: row_number
    physical_name: Row ID
    physical_type: integer
    description: A unique identifier assigned to each row in the table, used primarily
      for internal tracking and ordering of records.
    synonyms:
    - Record ID
    - Line Number
    - Sequence
  - name: order_id
    physical_name: Order ID
    physical_type: text
    description: The alphanumeric reference that uniquely identifies a customer order
      across the system.
    synonyms:
    - Order Reference
    - Transaction ID
    - Purchase Order
  - name: order_date
    physical_name: Order Date
    physical_type: date
    description: The calendar date on which the customer placed the order.
    synonyms:
    - Date Ordered
    - Purchase Date
    - Order Placement
  - name: ship_date
    physical_name: Ship Date
    physical_type: date
    description: The calendar date when the order was dispatched from the warehouse
      to the shipping carrier.
    synonyms:
    - Dispatch Date
    - Shipment Date
    - Delivery Start
  - name: ship_mode
    physical_name: Ship Mode
    physical_type: text
    description: The chosen method of transportation for delivering the order (e.g.,
      Second Class, First Class).
    synonyms:
    - Shipping Method
    - Carrier Type
    - Transport Mode
  - name: customer_id
    physical_name: Customer ID
    physical_type: text
    description: A unique alphanumeric code that identifies the customer who placed
      the order.
    synonyms:
    - Client ID
    - Buyer Code
    - Account Number
  - name: customer_name
    physical_name: Customer Name
    physical_type: text
    description: The full name of the individual or business that made the purchase.
    synonyms:
    - Client Name
    - Buyer Name
    - Account Holder
  - name: segment
    physical_name: Segment
    physical_type: text
    description: A high‑level classification of the customer (e.g., Consumer, Corporate,
      Home Office).
    synonyms:
    - Customer Segment
    - Market Category
    - Target Group
  - name: country
    physical_name: Country
    physical_type: text
    description: The sovereign nation where the order was placed or shipped.
    synonyms:
    - Nation
    - State Country
    - Geographic Country
  - name: city
    physical_name: City
    physical_type: text
    description: The city component of the shipping address for the order.
    synonyms:
    - Municipality
    - Town
    - Urban Area
  - name: state
    physical_name: State
    physical_type: text
    description: The state or province portion of the shipping address (applicable
      to countries with sub‑national divisions).
    synonyms:
    - Province
    - Region State
    - Administrative Division
  - name: postal_code
    physical_name: Postal Code
    physical_type: text
    description: The ZIP or postal code used for delivery routing.
    synonyms:
    - ZIP Code
    - Postcode
    - Delivery Code
  - name: region
    physical_name: Region
    physical_type: text
    description: A broader geographic area (e.g., East, West, Central) that groups
      multiple states or provinces.
    synonyms:
    - Geographic Region
    - Area
    - Zone
  - name: product_id
    physical_name: Product ID
    physical_type: text
    description: The unique identifier for the product sold in this line item.
    synonyms:
    - SKU
    - Item Code
    - Catalog Number
  - name: category
    physical_name: Category
    physical_type: text
    description: The top‑level classification of the product (e.g., Furniture, Office
      Supplies).
    synonyms:
    - Product Category
    - Main Group
    - Primary Class
  - name: sub_category
    physical_name: Sub-Category
    physical_type: text
    description: A more specific grouping within the main category (e.g., Bookcases,
      Chairs).
    synonyms:
    - Secondary Category
    - Detailed Group
    - Product Subclass
  - name: product_name
    physical_name: Product Name
    physical_type: text
    description: The descriptive name of the product sold.
    synonyms:
    - Item Name
    - Product Title
    - SKU Description
  - name: sales
    physical_name: Sales
    physical_type: float
    description: The total revenue generated from this line item before any discounts
      or returns.
    synonyms:
    - Revenue
    - Gross Sales
    - Transaction Amount
  - name: quantity
    physical_name: Quantity
    physical_type: integer
    description: The number of units of the product sold in this order line.
    synonyms:
    - Units Sold
    - Order Quantity
    - Item Count
  - name: discount
    physical_name: Discount
    physical_type: float
    description: The fractional discount applied to the unit price (e.g., 0.10 for
      a 10% discount).
    synonyms:
    - Price Reduction
    - Promotional Discount
    - Coupon Rate
  - name: profit
    physical_name: Profit
    physical_type: float
    description: The net earnings from this line item after subtracting cost of goods
      sold and discounts.
    synonyms:
    - Net Profit
    - Margin
    - Earnings
relationships: []
