services:
  redis:
    image: redis:7-alpine
    container_name: database-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: database-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  checkpoint-postgres:
    image: postgres:16
    container_name: database-agent-checkpoint-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: checkpoints
    ports:
      - "5434:5432"
    volumes:
      - checkpoint_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: database-agent-backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_DB_URI: postgresql://agent:agent@checkpoint-postgres:5432/checkpoints
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
      - checkpoint-postgres
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: database-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  checkpoint_postgres_data: