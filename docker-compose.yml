services:
  redis:
    image: redis:7-alpine
    container_name: database-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: database-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  checkpoint-postgres:
    image: postgres:16
    container_name: database-agent-checkpoint-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: checkpoints
    ports:
      - "5434:5432"
    volumes:
      - checkpoint_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  redis_data:
  qdrant_data:
  checkpoint_postgres_data: